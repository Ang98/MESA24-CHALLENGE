server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API va al contenedor del backend, en el mismo origen: sin CORS.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Agrega la IP que ve nginx al final de X-Forwarded-For. El backend
        # toma ese último valor (TRUSTED_PROXY_HOPS=1), no el primero, que
        # lo puede escribir el cliente.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: /l/:slug, /t/:token y /tablet los resuelve React.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
